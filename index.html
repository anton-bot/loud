	let g = 0;
	let b = 0;

		r = c;
		g = x;

		r = x;
		g = c;
	} else if (h < 180) {
		g = c;
		b = x;
	} else if (h < 240) {
		g = x;
		b = c;

		b = c;

//#region src/render/renderer.ts
/** Draws one frame: feedback, fade, camera shake, the mode, the look effects, then the compositor. */
/** Camera shake on the beat, the hand-held jitter of some looks, and phone motion. */
function moveCamera(moving) {

		shakeY += (Math.random() - .5) * k;
	}

		ctx.translate(cx, cy);
		ctx.rotate((Math.random() - .5) * .02 * jitter);
		ctx.translate(-cx, -cy);
		shakeX += (Math.random() - .5) * 5 * jitter;
		shakeY += (Math.random() - .5) * 5 * jitter;
	}
	ctx.translate(shakeX, shakeY);

		ctx.translate(cx, cy);

		const z = 1 + motion.shake * .08 + motion.twist * .03;
		ctx.scale(z, z);
		ctx.translate(-cx + motion.tiltX * width * .06, -cy + motion.tiltY * height * .06);
		ctx.drawImage(sceneCanvas, 0, 0, width, height);
		ctx.restore();
	}
	const zoom = mode.zoom ?? 1;
	const rotate = mode.rotate ?? 0;
	if (zoom !== 1 || rotate) {
		const z = 1 + (zoom - 1 + audio.bass * .02 + audio.beat * .03) * k60;
		ctx.save();
		ctx.translate(cx, cy);
		ctx.scale(z, z);
		ctx.rotate(rotate * (1 + audio.mid * 3) * k60);
		ctx.drawImage(sceneCanvas, -cx, -cy, width, height);
		ctx.restore();

	ctx.globalAlpha = mode.fade >= 1 ? 1 : 1 - Math.pow(1 - Math.min(.6, mode.fade + (moving ? motion.shake * .2 + motion.twist * .08 : 0)), dt * 60);

	ctx.globalAlpha = 1;
	ctx.save();
	moveCamera(moving);

	if (rings && mode.beatRings !== false) drawBeatRings(dt);
	ctx.restore();
}

	drawDream();
	drawHeardWords(dt);

	analyze(dt);
	updateMotion(dt);
	tickSpeech();
	updateMeter();
	scene.hue = (scene.hue + dt * 10) % 360;

	},
	{
		mode: "attractor",
		palette: "ultraviolet",
		words: "chaos smoke ghost хаос* дым* призрак* 混沌 烟"
	},
	{
		mode: "neon-tesla",
		palette: "ultraviolet",
		words: "electric lightning thunder storm tesla молни* гроз* электр* тесл* 闪电 雷 电"
	},
	{
		mode: "fireworks",
		palette: "lava",
		words: "dragon дракон* 龙"
	}
];
/** Chinese, Japanese and Korean characters. */
var CJK = /[぀-ヿ㐀-鿿가-힯]/;
/** How many words of `topic` are in the text. */
function score(topic, text, tokens) {
	let hits = 0;
	for (const word of topic.words.split(" ")) if (CJK.test(word)) {
		if (text.includes(word)) hits++;
	} else if (word.endsWith("*")) {
		const stem = word.slice(0, -1);
		hits += tokens.filter((t) => t.startsWith(stem)).length;
	} else hits += tokens.filter((t) => t === word || t === `${word}s` || t === `${word}es`).length;
	return hits;
}
/** The topic that the text talks about most, if any. */
function topicOf(text) {
	const lower = text.toLowerCase();
	const tokens = lower.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
	let best = null;
	let bestScore = 0;
	for (const topic of TOPICS) {
		const s = score(topic, lower, tokens);
		if (s > bestScore) {
			best = topic;
			bestScore = s;
		}
	}
	return best;
}
/** Switches to the scene of what was heard, if it names one. */
function steerByWords(text) {
	const topic = topicOf(text);
	if (!topic || !autoSwitchAllowed()) return;
	const modeIndex = MODES.findIndex((m) => m.name === topic.mode);
	if (modeIndex < 0) return;
	if (modeIndex !== scene.modeIndex) setMode(modeIndex);
	else scene.lastSwitch = clock.time;
	const paletteIndex = topic.palette ? PALETTES.findIndex((p) => p.name === topic.palette) : -1;
	if (paletteIndex >= 0 && paletteIndex !== scene.paletteIndex) setPalette(paletteIndex);
	setStatus(`Heard it: ${topic.mode}`);
}
//#endregion
//#region src/main.ts
onResize(() => {
	for (const mode of MODES) mode.resize?.();
});
addEventListener("resize", resize);
document.addEventListener("visibilitychange", () => {
	const visible = document.visibilityState !== "hidden";
	onPageVisibility(visible).then(() => {
		if (visible && isListening()) keepAwake();
	});
});
addEventListener("pagehide", releaseMic);
onHeard(showHeardWords);
onHeard(steerByWords);
onHeard(requestDream);
window.loudSay = (text, hero, ...ambient) => {
	showHeardWords(text, hero, ...ambient);
	steerByWords(text);
	requestDream(text);
};
window.loudDrop = simulateDrop;
window.loudDream = dreamFromUrl;
initControls();
initMotion();
resize();
shuffle();
enableTransitions();
startLoop();
//#endregion</script>
