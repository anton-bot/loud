<!doctype html>
<!-- The app moved to index.html (the site root). This page keeps old links working. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>loud — music visualizer</title>
    <script>
      // On the custom domain, go straight to https: the mic does not work over plain http.
      const root = location.hostname === 'loud.ivanov.hk' ? 'https://loud.ivanov.hk/' : './';
      location.replace(root + location.search + location.hash);
    </script>
  </head>
  <body style="background: #000; color: #ccc; font-family: sans-serif">
    <a href="./" style="color: #fff">Open loud</a>
  </body>
</html>
