		g = c;

/** Draws one frame: feedback, fade, camera shake, the mode, the look effects, then the compositor. */
function renderFrame(mode, dt) {
	const { width, height, cx, cy } = view;
	const k60 = Math.min(3, dt * 60);
	const moving = motionIsActive();
	ctx.globalCompositeOperation = "source-over";
	ctx.globalAlpha = 1;
	ctx.imageSmoothingEnabled = true;
	if (moving && mode.fade < 1) {
		ctx.save();
		ctx.translate(cx, cy);
		ctx.rotate(motion.spin * .06 + motion.tiltX * .03);
		const z = 1 + motion.shake * .08 + motion.twist * .03;
		ctx.scale(z, z);
		ctx.translate(-cx + motion.tiltX * width * .06, -cy + motion.tiltY * height * .06);
		ctx.drawImage(sceneCanvas, 0, 0, width, height);
		ctx.restore();
	}
	const zoom = mode.zoom ?? 1;
	const rotate = mode.rotate ?? 0;
	if (zoom !== 1 || rotate) {
		const z = 1 + (zoom - 1 + audio.bass * .02 + audio.beat * .03) * k60;
		ctx.save();
		ctx.translate(cx, cy);
		ctx.scale(z, z);
		ctx.rotate(rotate * (1 + audio.mid * 3) * k60);
		ctx.drawImage(sceneCanvas, -cx, -cy, width, height);
		ctx.restore();
	}
	ctx.globalAlpha = mode.fade >= 1 ? 1 : 1 - Math.pow(1 - Math.min(.6, mode.fade + (moving ? motion.shake * .2 + motion.twist * .08 : 0)), dt * 60);
	ctx.fillStyle = backgroundGradient(ctx);
	ctx.fillRect(0, 0, width, height);
	ctx.globalAlpha = 1;
	ctx.save();
	let shakeX = 0;
	let shakeY = 0;
	if (audio.beat > .05) {
		const k = audio.beat * audio.beat * 4;
		shakeX += (Math.random() - .5) * k;
		shakeY += (Math.random() - .5) * k;
	}
	const jitter = scene.look.jitter;
	if (jitter) {
		ctx.translate(cx, cy);
		ctx.rotate((Math.random() - .5) * .02 * jitter);
		ctx.translate(-cx, -cy);
		shakeX += (Math.random() - .5) * 5 * jitter;
		shakeY += (Math.random() - .5) * 5 * jitter;
	}
	ctx.translate(shakeX, shakeY);
	if (moving) {
		ctx.translate(cx, cy);
		ctx.rotate(motion.tiltX * .12 + motion.spin * .3);
		const z = 1 + motion.shake * .2;
		ctx.scale(z, z);
		ctx.translate(-cx + motion.tiltX * width * .1, -cy + motion.tiltY * height * .1);
	}
	ctx.globalCompositeOperation = mode.blend || scene.palette.blend;
	mode.draw(dt);
	if (mode.beatRings !== false) drawBeatRings(dt);
	drawHeardWords();
	ctx.restore();
	applyLookEffects();
	composite(mode, dt);
}

/** The frame loop: analyse the audio, update the scene, render. */

	analyze(dt);
	updateMotion(dt);

.gate-slider input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: var(--thumb);
  height: var(--thumb);
  margin-top: -6px;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 1px 4px rgba(0, 0, 0, 0.5);
}

.gate-slider input::-moz-range-thumb {
  width: var(--thumb);
  height: var(--thumb);
  border: 0;
  border-radius: 50%;
  background: #fff;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 1px 4px rgba(0, 0, 0, 0.5);
}

.noise-mark {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: var(--level-x);
  width: 3px;
  margin-left: -1.5px;
  border-radius: 2px;
  background: #ff3d6e;
  box-shadow: 0 0 6px #ff3d6e;
  pointer-events: none;
}

.link {
  max-width: 55vw;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  -webkit-user-select: text;
  user-select: text;
}

.status {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  min-height: 1.3em;
  text-shadow: var(--text-shadow);
}

/* Full list of styles, palettes or looks (long-press a chip) */

#menu {
  position: fixed;
  inset: 0;
  z-index: 5;
}

#menuBack {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

#menu .panel {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(82vw, 340px);
  max-height: min(62vh, 520px);
  display: flex;
  flex-direction: column;
  background: rgba(12, 12, 16, 0.92);
  border: 1px solid var(--line);
  border-radius: 18px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow: hidden;
}

.mt {
  padding: 12px 16px 8px;
  font-size: 12px;
  color: var(--muted);
}

#menuList {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: 4px 8px 10px;
}

.mi {
  display: block;
  width: 100%;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 16px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.mi.on {
  background: var(--chip-on);
}

.mi:active {
  background: var(--chip);
}

/* Phones in portrait: smaller chips, and the palette as a colour dot only, so that the row fits. */
@media (max-width: 440px) {
  .bar {
    padding-left: 8px;
    padding-right: 8px;
  }

  .chips {
    gap: 4px;
  }

  .chip {
    height: 30px;
    padding: 0 9px;
    font-size: 12px;
  }

  .chip.name {
    max-width: 5em;
  }

  .chip.icon {
    width: 29px;
  }

  #palBtn {
    width: 30px;
    padding: 0;
  }

  #palName {
    display: none;
  }

  #palBtn .swatch {
    width: 14px;
    height: 14px;
    margin: 0;
    vertical-align: -3px;
  }

  .group .chip {
    padding: 0 5px;
  }

  .group .chip.name {
    padding: 0 2px;
  }

  svg {
    width: 15px;
    height: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #ui {
    transition: none;
  }
}

  <body>
    <canvas id="display"></canvas>

    <div id="ui">
      <div class="bar top">
        <div class="brand">loud <span id="modeName">nebula</span></div>
        <button class="ic" id="fsBtn" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="enter"
              d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"
            />
            <path
              class="exit"
              d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"
            />
          </svg>
        </button>
      </div>

      <div class="bar bottom">
        <button class="mic" id="micBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8" />
          </svg>
          <span>Mic</span>
          <span class="dot" aria-hidden="true"></span>
        </button>

        <!-- Shown when a frame around the page blocks the mic. -->
        <div class="row" id="linkRow" hidden>
          <input id="linkBox" class="chip link" readonly aria-label="This page's own link" />
          <button class="chip" id="copyBtn">Copy link</button>
          <button class="chip" id="tabBtn">New tab</button>
        </div>

        <!-- Shown while the mic is on. The red mark is the live sound level. -->
        <div class="row gate" id="gateRow" hidden>
          <label for="gate" title="Sounds below the gate are ignored">Gate</label>
          <div class="gate-slider" id="gateSlider">
            <input id="gate" type="range" min="-80" max="-20" step="1" value="-50" />
            <div class="noise-mark" aria-hidden="true"></div>
          </div>
          <button
            class="chip"
            id="wordsBtn"
            aria-pressed="false"
            title="Words: every 45 s, send 8 s of sound to ElevenLabs and show the words it hears"
          >
            Words
          </button>
        </div>

        <!-- Tap a name chip for the next one; hold it for the full list. -->
        <div class="row chips">
          <div class="group">
            <button class="chip" id="prevMode" aria-label="Previous mode">‹</button>
            <button class="chip name" id="modeBtn" title="Mode: tap for the next, hold for the list">
              nebula
            </button>
            <button class="chip" id="nextMode" aria-label="Next mode">›</button>
          </div>
          <button
            class="chip name"
            id="palBtn"
            title="Palette: tap for the next, hold for the list"
            aria-label="Palette"
          >
            <span class="swatch" id="palSwatch"></span><span id="palName">void</span>
          </button>
          <button class="chip name" id="lookBtn" title="Look: tap for the next, hold for the list">
            clean
          </button>
          <button class="chip icon" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
            </svg>
          </button>
          <button
            class="chip icon on"
            id="autoBtn"
            aria-pressed="true"
            title="Auto-switch: a new scene now and then"
            aria-label="Auto-switch"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
            </svg>
          </button>
          <button
            class="chip icon on"
            id="secBtn"
            aria-pressed="true"
            title="Sections: a new scene when the music changes"
            aria-label="Sections"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          </button>
          <button
            class="chip icon"
            id="motionBtn"
            aria-pressed="false"
            title="Motion: tilt, twist and shake the phone"
            aria-label="Motion"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="3" width="8" height="18" rx="2" transform="rotate(-15 12 12)" />
              <path d="M4 9a6 6 0 0 0 0 6M20 9a6 6 0 0 1 0 6" />
            </svg>
          </button>
        </div>

        <div class="status" id="status" aria-live="polite">
          Tap Mic and play some music. Double-tap right or left to change the mode.
        </div>
      </div>
    </div>

    <div id="menu" hidden>
      <div id="menuBack"></div>
      <div class="panel">
        <div id="menuTitle" class="mt">Style</div>
        <div id="menuList"></div>
      </div>
    </div>
  </body>
