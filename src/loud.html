<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>loud — music visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas id="display"></canvas>

    <div id="ui">
      <div class="bar top">
        <div class="brand">loud <span id="modeName">nebula</span></div>
        <button class="ic" id="fsBtn" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="enter"
              d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"
            />
            <path
              class="exit"
              d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"
            />
          </svg>
        </button>
      </div>

      <div class="bar bottom">
        <button class="mic" id="micBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8" />
          </svg>
          <span>Mic</span>
          <span class="dot" aria-hidden="true"></span>
        </button>

        <!-- Shown when a frame around the page blocks the mic. -->
        <div class="row" id="linkRow" hidden>
          <input id="linkBox" class="chip link" readonly aria-label="This page's own link" />
          <button class="chip" id="copyBtn">Copy link</button>
          <button class="chip" id="tabBtn">New tab</button>
        </div>

        <!-- Shown while the mic is on. The red mark is the live sound level. -->
        <div class="row gate" id="gateRow" hidden>
          <label for="gate" title="Sounds below the gate are ignored">Gate</label>
          <div class="gate-slider" id="gateSlider">
            <input id="gate" type="range" min="-80" max="-20" step="1" value="-50" />
            <div class="noise-mark" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Tap a name chip for the next one; hold it for the full list. -->
        <div class="row chips">
          <div class="group">
            <button class="chip" id="prevMode" aria-label="Previous mode">‹</button>
            <button class="chip name" id="modeBtn" title="Mode: tap for the next, hold for the list">
              nebula
            </button>
            <button class="chip" id="nextMode" aria-label="Next mode">›</button>
          </div>
          <button
            class="chip name"
            id="palBtn"
            title="Palette: tap for the next, hold for the list"
            aria-label="Palette"
          >
            <span class="swatch" id="palSwatch"></span><span id="palName">void</span>
          </button>
          <button class="chip name" id="lookBtn" title="Look: tap for the next, hold for the list">
            clean
          </button>
          <button class="chip icon" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
            </svg>
          </button>
          <button
            class="chip icon on"
            id="autoBtn"
            aria-pressed="true"
            title="Auto-switch: a new scene now and then"
            aria-label="Auto-switch"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
            </svg>
          </button>
          <button
            class="chip icon on"
            id="secBtn"
            aria-pressed="true"
            title="Sections: a new scene when the music changes"
            aria-label="Sections"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          </button>
          <button
            class="chip icon"
            id="motionBtn"
            aria-pressed="false"
            title="Motion: tilt, twist and shake the phone"
            aria-label="Motion"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="3" width="8" height="18" rx="2" transform="rotate(-15 12 12)" />
              <path d="M4 9a6 6 0 0 0 0 6M20 9a6 6 0 0 1 0 6" />
            </svg>
          </button>
        </div>

        <div class="status" id="status" aria-live="polite">
          Tap Mic and play some music. Double-tap right or left to change the mode.
        </div>
      </div>
    </div>

    <div id="menu" hidden>
      <div id="menuBack"></div>
      <div class="panel">
        <div id="menuTitle" class="mt">Style</div>
        <div id="menuList"></div>
      </div>
    </div>
  </body>
</html>
